# Receives structured application logs shipped by Serilog (Serilog.Sinks.Network TCPSink)
# from SubsTracker.API and SubsTracker.Hangfire, and forwards them to Elasticsearch.
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "substracker-logs-%{+YYYY.MM.dd}"
  }
}
